<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>상태변화와 입자 원정대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;600;800&family=Noto+Sans+SC:wght@400;600;800&display=swap">
<style>
/* 레이아웃: 고정 크기 무대를 화면에 맞춰 통째로 확대·축소해 스크롤이 생기지 않는다. 온도 곡선을 보드게임 판으로 삼고, 아래에 입자 관찰창, 오른쪽에 문제 카드를 둔다. 모눈종이 위 스티커 느낌의 단일 테마. */
:root{
  --paper:#eaf3fa; --grid:#d3e3f0; --card:#ffffff; --ink:#1c2752; --ink-soft:#56618c;
  --heat:#f2542d; --heat-soft:#ffe3d8; --cold:#1479d9; --cold-soft:#d9edff;
  --good:#0d9a78; --good-soft:#d6f5ea; --sun:#ffc62e; --sun-soft:#fff2c4; --bad:#c9304a; --bad-soft:#ffe1e6;
  --accent:var(--heat); --accent-soft:var(--heat-soft);
  --display:"Jua","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --line:3px solid var(--ink); --pop:4px 4px 0 var(--ink);
}
[data-course="cool"]{--accent:var(--cold);--accent-soft:var(--cold-soft)}
:root[lang="zh"]{--display:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
[lang="zh"] .hero h1,[lang="zh"] .top h2,[lang="zh"] .course h2{font-weight:800}
.langs{display:inline-flex;gap:4px}
.langs button{font:800 .88rem var(--body);padding:.25em .65em;background:var(--card);border:2px solid var(--ink);border-radius:9px}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
.kb body{overflow-y:auto;-webkit-overflow-scrolling:touch}
body{
  font:16px/1.55 var(--body);color:var(--ink);word-break:keep-all;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
h1,h2,h3,p{margin:0}
#fit{position:relative;width:100%;height:100%;overflow:hidden}
#app{position:absolute;left:0;top:0;transform-origin:0 0;padding:16px 20px}
.view{height:100%;display:grid;gap:14px;min-height:0}
#vHome{align-content:center}
#vGame{grid-template-rows:auto minmax(0,1fr)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{
  font-family:var(--display);font-size:1.1rem;padding:.55em 1.1em;background:var(--card);
  border:var(--line);border-radius:12px;box-shadow:var(--pop);transition:transform .08s,box-shadow .08s;
}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.main{background:var(--accent);color:#fff}
.btn.sun{background:var(--sun)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.small{font-size:.95rem;padding:.3em .8em;box-shadow:2px 2px 0 var(--ink);border-width:2px;border-radius:9px}

/* 첫 화면 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:center;background:var(--card);border:var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:24px}
.hero h1{font:400 3.3rem/1.12 var(--display);text-wrap:balance}
.hero h1 span{color:var(--heat)} .hero h1 span+span{color:var(--cold)}
.hero p{margin-top:10px;max-width:34em;color:var(--ink-soft);font-weight:600}
.hero canvas{width:100%;display:block;border:6px solid #444;border-radius:12px;aspect-ratio:2/1;background:#fff}
.hero .cap{font-size:.95rem;font-weight:800;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--sun-soft);border:var(--line);border-radius:16px;padding:14px 16px}
.who label{display:grid;gap:3px;font-weight:800;font-size:.9rem}
.who input,.who select{border:2px solid var(--ink);border-radius:9px;padding:.45em .6em;background:var(--card);font-weight:600}
.who #inName{width:9.5em}.who select{width:5.2em}.who #inGrade{width:7.5em}
.who .msg:empty{display:none}
.who .msg{flex:1 1 100%;color:var(--bad);font-weight:800;min-height:1.4em;font-size:.92rem}
.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.course{
  display:grid;grid-template-columns:128px minmax(0,1fr);gap:16px;align-items:center;text-align:left;
  background:var(--card);border:var(--line);border-radius:18px;box-shadow:var(--pop);padding:16px;transition:transform .1s;
}
.course:hover{transform:translate(-2px,-2px)}
.course svg{width:100%;background:var(--accent-soft);border:2px solid var(--ink);border-radius:12px}
.course h2{font:400 1.5rem/1.2 var(--display)}
.course small{display:block;color:var(--ink-soft);font-weight:600;margin-top:4px;font-size:.9rem}
.course .state{display:inline-block;margin-top:8px;font-weight:800;font-size:.84rem;padding:.1em .6em;border-radius:99px;background:var(--accent-soft)}
.rules{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;font-size:.92rem;font-weight:600;color:var(--ink-soft)}
.rules b{color:var(--ink)}

/* 게임 화면 */
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--card);border:var(--line);border-radius:14px;padding:8px 14px}
.top h2{font:400 1.3rem/1.2 var(--display);color:var(--accent);flex:0 1 auto}
.top .who-line{font-size:.88rem;font-weight:600;color:var(--ink-soft)}
.meter{flex:1 1 160px;min-width:0;height:14px;background:var(--paper);border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.tally{display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.tally b{font:400 1.6rem/1 var(--display)}
.tally .combo{font-weight:800;font-size:.85rem;background:var(--sun);border:2px solid var(--ink);border-radius:99px;padding:.05em .6em}
.game{display:grid;min-height:0;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);gap:12px}
[data-o="p"] .game{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
[data-o="p"] .board{height:380px}
[data-o="p"] .boss{padding:12px 16px;gap:10px}
[data-o="p"] .boss svg{width:96px;flex-basis:96px}
[data-o="p"] .board{grid-area:1/1}
[data-o="p"] .scope{grid-area:2/1}
[data-o="p"] .q{grid-area:3/1}
[data-o="p"] .courses{grid-template-columns:minmax(0,1fr)}
.board{grid-area:1/1/3/2;background:var(--card);border:var(--line);border-radius:18px;overflow:hidden;min-width:0;min-height:0}
.board svg{display:block;width:100%;height:100%}
.scope{grid-area:1/2;display:grid;grid-template-columns:200px minmax(0,1fr);align-items:center;background:var(--card);border:var(--line);border-radius:16px;overflow:hidden}
.scope canvas{display:block;width:100%;aspect-ratio:2/1;background:#fff;border-right:var(--line)}
.scope .read{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:6px 10px;font-size:.78rem;font-weight:800;align-items:center}
.scope .bar{height:10px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper)}
.scope .bar i{display:block;height:100%;width:0%;background:var(--heat)}
.scope .bar.sp i{background:var(--sun)}
.scope .now{grid-column:1/-1;font:400 .95rem/1.25 var(--display)}
.scope .tools{grid-column:1/-1}
.scope .tools{display:flex;align-items:center;justify-content:space-between;gap:6px;font:800 .78rem var(--body)}
.scope .tools label,.labChk{display:flex;align-items:center;gap:6px;cursor:pointer}
.scope .tools input,.labChk input{width:16px;height:16px;margin:0;accent-color:var(--heat)}
.lab{position:absolute;inset:0;z-index:20;background:var(--paper);padding:16px 20px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px}
.labTop{display:flex;align-items:center;gap:16px}
.labTop h2{font:400 1.6rem var(--display)}
.labNow{flex:1;font-weight:800;color:var(--ink-soft)}
.lab canvas{justify-self:center;max-width:100%;max-height:100%;aspect-ratio:2/1;min-height:0;background:#fff;border:10px solid #444;border-radius:14px}
.labBar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.labChk{font-weight:800}
.lab-s[aria-pressed="true"]{background:var(--sun)}
.q{grid-area:2/2;grid-template-columns:minmax(0,1fr);align-content:start;overflow:hidden;min-height:0;background:var(--card);border:var(--line);border-radius:16px;box-shadow:var(--pop);padding:12px 16px;display:grid;gap:8px}
.q .tag{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.84rem;font-weight:800;color:var(--ink-soft)}
.q .worth{font-family:var(--display);font-weight:400;background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:0 .7em;font-size:.95rem;white-space:nowrap}
.q .ask{font-weight:800;font-size:1.08rem;line-height:1.5}
.answer{display:flex;gap:8px}
.answer input{flex:1 1 auto;min-width:0;border:var(--line);border-radius:11px;padding:.5em .7em;font-size:1.15rem;font-weight:800;background:#fff}
.tiles{display:grid;gap:8px}
.tile{font-weight:800;font-size:1.02rem;padding:.55em .7em;background:var(--accent-soft);border:var(--line);border-radius:11px;box-shadow:2px 2px 0 var(--ink)}
.tile:hover:not(:disabled){background:var(--sun-soft)}
.tile:disabled{background:var(--bad-soft);color:var(--ink-soft);text-decoration:line-through;box-shadow:none;cursor:not-allowed}
.tile.ok:disabled{background:var(--good-soft);color:var(--ink);text-decoration:none;border-color:var(--good)}
.say{padding:.4em .7em;border-radius:10px;font-weight:600;font-size:.96rem;border:2px solid var(--ink)}
.say.no{background:var(--bad-soft)} .say.hint{background:var(--sun-soft)} .say.why{background:var(--good-soft)}
.say b{font-family:var(--display);font-weight:400}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.gain{position:fixed;z-index:30;font:400 2.6rem var(--display);color:var(--good);-webkit-text-stroke:1px var(--ink);pointer-events:none;animation:gain 1s ease-out forwards}
@keyframes gain{from{transform:translateY(10px) scale(.7);opacity:0}25%{transform:translateY(0) scale(1.15);opacity:1}to{transform:translateY(-46px);opacity:0}}

/* 지도 위 요소 */
.slot rect{fill:#fff;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:6 4}
.slot text{font:400 17px var(--display);fill:var(--ink-soft);text-anchor:middle;dominant-baseline:central}
.slot.on rect{fill:var(--sun);stroke-dasharray:none;stroke-width:3.5;animation:pulse 1.1s infinite}
.slot.done rect{fill:var(--good-soft);stroke:var(--good);stroke-dasharray:none}
.slot.done text{fill:var(--ink)}
.slot .pt{font-size:12px}
.slot .ptc{fill:var(--good);stroke:none}
.slot .pt{fill:#fff}
.pic{transition:opacity .5s}
@keyframes pulse{50%{fill:var(--sun-soft)}}
.boss{display:grid;gap:16px;padding:20px;height:100%;align-content:center}
.boss .fight{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.boss svg{width:130px;height:auto;flex:0 0 130px}
.boss .bubble{flex:1 1 240px;min-width:0;background:var(--bad-soft);border:var(--line);border-radius:14px;padding:12px 14px;font-weight:800;font-size:1.05rem}
.hp{display:flex;align-items:center;gap:10px;font:400 1rem var(--display)}
.hp div{flex:1;height:18px;background:var(--paper);border:var(--line);border-radius:99px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--bad);transition:width .5s}
.line{font-size:1.25rem;font-weight:800;line-height:2.1;background:var(--paper);border:var(--line);border-radius:14px;padding:12px 16px}
.line .bl{display:inline-block;min-width:4.4em;text-align:center;line-height:1.5;padding:0 .4em;border:2px dashed var(--ink);border-radius:8px;background:#fff;color:var(--ink-soft)}
.line .bl.on{background:var(--sun);border-style:solid;color:var(--ink)}
.line .bl.done{background:var(--good-soft);border:2px solid var(--good);color:var(--ink)}
.hit{animation:hit .4s}
@keyframes hit{30%{transform:translateX(10px) rotate(6deg);filter:brightness(1.4)}}
.writebox{padding:20px;display:grid;gap:12px}
.writebox h3{font:400 1.5rem var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-weight:800;font-size:.92rem;padding:.15em .75em;border:2px solid var(--ink);border-radius:99px;background:var(--paper)}
.chip.ok{background:var(--good-soft);border-color:var(--good)}
textarea{width:100%;min-height:130px;border:var(--line);border-radius:12px;padding:.6em .8em;font-size:1.1rem;line-height:1.6;background:#fff;resize:vertical}

/* 결과 */
.done-card{background:var(--card);border:var(--line);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:12px 16px;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;justify-items:center;min-height:0}
.done-card h2{font:400 1.7rem var(--display);text-align:center;text-wrap:balance}
.done-card img{max-width:100%;max-height:100%;min-height:0;border:var(--line);border-radius:12px;display:block}
.done-card .acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.done-card .note{font-size:.92rem;font-weight:600;color:var(--ink-soft);text-align:center;min-height:1.5em}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="fit"><div id="app">

  <section id="vHome" class="view">
    <div class="hero">
      <div>
        <h1 id="heroTitle"></h1>
        <p data-i>온도 곡선을 따라 걸으며 빈칸을 채워 보세요. 입자가 어떻게 달라지는지 눈으로 확인하고, 마지막에 나타나는 오개념 몬스터를 물리치면 원정 인증서를 받습니다.</p>
      </div>
      <div>
        <canvas id="heroCv" width="700" height="350" aria-label="고체, 액체, 기체로 변하는 입자 움직임"></canvas>
        <p class="cap"><span id="heroCap">고체</span> <button class="btn small labOpen" type="button" data-i>입자 실험실 열기</button></p>
      </div>
    </div>
    <div class="who" id="whoForm">
      <label><span data-i>학년</span><select id="inGrade" disabled><option data-i>1학년</option></select></label>
      <label for="inClass"><span data-i>반</span><select id="inClass"></select></label>
      <label for="inNum"><span data-i>번호</span><select id="inNum"></select></label>
      <label for="inName"><span data-i>이름</span><input id="inName" maxlength="10" data-ip="이름을 쓰세요"></label>
      <div class="langs" style="margin-left:auto"></div>
      <p class="msg" id="whoMsg"></p>
    </div>
    <div class="courses" id="courses"></div>
    <div class="rules">
      <span><b data-i>첫 시도 5점</b><span data-i>, 다시 할 때마다 1점씩 줄어요 (최저 1점)</span></span>
      <span><b data-i>2번 틀리면</b><span data-i> 힌트가 나와요</span></span>
      <span><b data-i>모두 맞히면</b><span data-i> 인증서를 이미지로 저장해요</span></span>
      <button class="btn small fsBtn" type="button">전체화면</button>
    </div>
  </section>

  <section id="vGame" class="view" hidden>
    <div class="top">
      <button class="btn small" id="btnHome" type="button" data-i>처음으로</button>
      <h2 id="gTitle"></h2>
      <span class="who-line" id="gWho"></span>
      <div class="meter" aria-hidden="true"><i id="gMeter"></i></div>
      <div class="tally">
        <span class="combo" id="gCombo" hidden></span>
        <span><b id="gScore">0</b> <span data-i>점</span></span>
        <div class="langs short"></div>
        <button class="btn small" id="btnSound" type="button" aria-pressed="false">소리 끔</button>
        <button class="btn small fsBtn" type="button">전체화면</button>
      </div>
    </div>
    <div class="game">
      <div class="board" id="board"></div>
        <div class="scope">
          <canvas id="scopeCv" width="800" height="400" aria-label="현재 위치의 입자 모습"></canvas>
          <div class="read">
            <span class="now" id="scNow"></span>
            <span data-i>온도</span><div class="bar"><i id="scT"></i></div>
            <span class="tools"><label><input type="checkbox" id="chkBond"> <span data-i>인력 표시</span></label><button class="btn small labOpen" type="button" data-i>크게 보기</button></span>
          </div>
        </div>
        <div class="q" id="qCard"></div>
    </div>
  </section>

  <section id="vDone" class="view" hidden>
    <div class="done-card">
      <h2 id="dTitle"></h2>
      <img id="dImg" alt="완성한 온도 곡선과 점수가 담긴 원정 인증서">
      <div class="acts">
        <button class="btn sun" id="btnSave" type="button" data-i>화면 캡쳐 저장하기</button>
        <button class="btn" id="btnAgain" type="button" data-i>다시 도전하기</button>
        <button class="btn" id="btnBack" type="button" data-i>처음으로</button>
        <button class="btn fsBtn" type="button">전체화면</button>
        <div class="langs"></div>
      </div>
      <p class="note" id="dNote">저장 버튼이 되지 않으면 인증서 그림을 길게 눌러 저장하세요.</p>
    </div>
  </section>
  <div class="lab" id="lab" hidden>
    <div class="labTop"><h2 data-i>입자 실험실</h2><span id="labNow" class="labNow">고체</span><button class="btn small" id="labClose" type="button" data-i>닫기</button></div>
    <canvas id="labCv" width="1800" height="900" aria-label="상자 안에서 움직이는 입자"></canvas>
    <div class="labBar">
      <button class="btn lab-s" type="button" data-m="0" data-i>고체</button>
      <button class="btn lab-s" type="button" data-m="1" data-i>액체</button>
      <button class="btn lab-s" type="button" data-m="2" data-i>기체</button>
      <button class="btn main" id="labRun" type="button">멈춤</button>
      <label class="labChk"><input type="checkbox" id="labBond"> <span data-i>입자 사이의 인력 표시</span></label>
    </div>
  </div>
</div></div>
<canvas id="fx" hidden></canvas>

<script>
/* ===== 선생님 설정 ===== */
const CLASS_COUNT = 12, STUDENT_COUNT = 40;

'온도계의 위쪽 빈칸이에요. 기체가 액체로 변하는 동안 머무는 이 온도는 액체가 끓을 때의 온도와 같아요. 이름이 무엇일까요?':['This is the upper blank on the thermometer. The temperature stays here while a gas turns into a liquid. It is the same as the temperature at which the liquid boils. What is it called?','这是温度计上方的空格。气体变成液体时,温度停留在这里,它和液体沸腾时的温度相同。这个温度叫什么?'],
'물이 100 ℃에서 부글부글할 때의 온도를 뭐라고 부르는지 떠올려 보세요. ○○점이에요.':['Think of what we call the temperature at which water bubbles at 100 ℃.','想一想,水在 100 ℃ 沸腾时的温度叫什么。'],
'액체가 끓는 온도와 기체가 액체로 변하는 온도는 같아요.':['The temperature at which a liquid boils is the same as the temperature at which its gas turns into liquid.','液体沸腾的温度和气体变成液体的温度相同。'],
'기체가 액체로 변하는 상태 변화의 이름은 무엇일까요?':['What is the change of state from gas to liquid called?','气体变成液体的状态变化叫什么?'],
'욕실 거울에 물방울이 맺히는 현상이에요. 무엇이 되는 변화인지 생각해 보세요.':['This is what makes water drops form on a bathroom mirror. Think about what the gas turns into.','浴室镜子上出现水珠就是这种现象。想一想气体变成了什么。'],
'기체가 액체(液)가 되니 액화(液化)예요.':['Gas becoming liquid is called condensation.','气体变成液体(液),所以叫液化。'],
'응고는 다른 구간의 변화예요. 지금은 기체에서 액체로 변하고 있어요.':['That change happens in another part of the curve. Here, gas is turning into liquid.','那是另一段曲线的变化。现在是气体变成液体。'],
'기화는 반대 방향이에요. 지금은 온도가 내려가고 있어요.':['That goes the opposite way. The temperature is falling here.','方向相反。现在温度正在下降。'],
'기체가 액체로 변할 때 열에너지는 어떻게 될까요?':['What happens to thermal energy when a gas turns into a liquid?','气体变成液体时,热能会怎样?'],
'곡선의 파란 화살표 방향을 보세요. 물질에서 어디로 향하나요?':['Look at the blue arrow on the curve. Which way does it point from the substance?','看曲线上的蓝色箭头。它从物质指向哪里?'],
'냉각되는 물질은 상태가 변하는 동안에도 열에너지를 내보내요.':['A cooling substance keeps giving out thermal energy even while its state changes.','冷却的物质在状态变化时也会放出热能。'],
'열에너지를 내보내는데 곡선이 평평해요. 상태가 변하는 동안 온도는 어떻게 될까요?':['Energy is leaving, but the curve is flat. What happens to the temperature while the state changes?','物质在放出热能,曲线却是平的。状态变化时温度会怎样?'],
'캐릭터가 걷는 길의 높이를 보세요. 곡선의 높이가 바로 온도예요.':['Look at the height of the path. The height of the curve is the temperature.','看角色走的路有多高。曲线的高度就是温度。'],
'상태가 변하며 나온 열에너지가 온도가 내려가는 것을 막아서, 평평한 구간이 생겨요.':['Energy released by the change of state stops the temperature from falling, so the curve is flat.','状态变化放出的热能阻止了温度下降,所以曲线出现平的部分。'],
'기체가 액체로 변하는 동안 입자의 운동은 어떻게 될까요?':['What happens to particle motion while a gas turns into a liquid?','气体变成液体时,粒子运动会怎样?'],
'왼쪽 온도계를 보세요. 온도는 입자 운동이 얼마나 활발한지를 나타내요. 지금 온도는 어떤가요?':['Look at the thermometer. Temperature shows how active the particles are. What is the temperature doing now?','看温度计。温度表示粒子运动的活跃程度。现在温度怎么样?'],
'온도가 그대로이니 입자 운동의 활발한 정도도 그대로예요. 상태 변화에서 달라지는 것은 배열과 거리예요.':['The temperature stays the same, so particle activity stays the same too. What changes is the arrangement and the distance.','温度不变,粒子运动的活跃程度也不变。状态变化时改变的是排列和距离。'],
'열에너지를 흡수한 입자를 떠올려 보세요.':['Think of particles that have absorbed thermal energy.','想一想吸收了热能的粒子。'],
'열에너지를 방출한 입자를 떠올려 보세요.':['Think of particles that have released thermal energy.','想一想放出了热能的粒子。'],
'열에너지를 흡수하면 입자 운동이 활발해져요.':['Absorbing thermal energy makes particles more active.','吸收热能后,粒子运动变得更活跃。'],
'열에너지를 방출하면 입자 운동이 둔해져요.':['Releasing thermal energy makes particles less active.','放出热能后,粒子运动变得更迟缓。'],
'기체가 액체로 변하는 동안 입자의 배열은 어떻게 될까요?':['What happens to the particle arrangement while a gas turns into a liquid?','气体变成液体时,粒子的排列会怎样?'],
'위의 입자 관찰창을 보세요. 입자들이 흩어져 있었나요, 모이고 있나요?':['Look at the particle window. Are the particles spreading out or gathering together?','看粒子观察窗。粒子是在散开,还是在聚集?'],
'흩어져 날아다니던 입자들이 서로 모이면서 배열이 더 규칙적으로 변해요.':['Particles that were flying apart gather together, so the arrangement becomes more regular.','四处飞散的粒子聚集在一起,排列变得更有规律。'],
'기체가 액체로 변하는 동안 입자 사이의 거리는 어떻게 될까요?':['What happens to the distance between particles while a gas turns into a liquid?','气体变成液体时,粒子之间的距离会怎样?'],
'기체 입자와 액체 입자 중 어느 쪽이 더 붙어 있나요?':['Which are closer together: gas particles or liquid particles?','气体粒子和液体粒子,哪一种靠得更近?'],

'온도계의 아래쪽 빈칸이에요. 액체가 고체로 변하는 동안 머무는 이 온도의 이름은 무엇일까요?':['This is the lower blank on the thermometer. The temperature stays here while a liquid turns into a solid. What is it called?','这是温度计下方的空格。液体变成固体时,温度停留在这里。这个温度叫什么?'],

'액체가 고체로 변하는 상태 변화의 이름은 무엇일까요?':['What is the change of state from liquid to solid called?','液体变成固体的状态变化叫什么?'],

'엉겨서 굳어진다는 뜻의 응고(凝固)예요.':['A liquid becoming a solid is called freezing, or solidification.','液体凝结变硬,所以叫凝固。'],
'액화는 기체가 액체로 변하는 것이에요. 지금은 액체가 고체로 변해요.':['That is gas turning into liquid. Here, liquid is turning into solid.','那是气体变成液体。现在是液体变成固体。'],

function tone(seq){
  if(!S.sound) return;

    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    let t=ac.currentTime;
    seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);t+=d*.7;});
  }catch(e){}
}

    const cols=9,gap=1.12,left=this.Lx/2-(cols-1)*gap/2;
    for(let i=0;i<N;i++){
      const row=Math.floor(i/cols),c=i%cols;
      this.ps.push({hx:left+c*gap+(row%2?gap/4:-gap/4),hy:this.Ly-.7-row*gap*.87,x:0,y:0,vx:0,vy:0,fx:0,fy:0,th:(i*.618%1)*.96+.02,th2:(i*.382%1)*.96+.02,e:1,s:0});
    }
    this.seed(0);
  }
  kT(){return .08+.9*this.t;}
  seed(m){
    this.m=m;const v=Math.sqrt(this.kT());
    this.ps.forEach((p,i)=>{
      if(m>1.5){p.x=1+(i%9)*(this.Lx-2)/8;p.y=1+Math.floor(i/9)*(this.Ly-2)/6.2;}else{p.x=p.hx;p.y=p.hy;}
      const a=Math.random()*6.28;p.vx=Math.cos(a)*v;p.vy=Math.sin(a)*v;
    });
  }
  phase(p){return this.m<=1?(this.m>p.th?1:0):(this.m-1>p.th2?2:1);}
  step(h){
    const{ps,Lx,Ly}=this,kT=this.kT(),n=ps.length;
    for(let i=0;i<n;i++){const p=ps[i];p.s=this.phase(p);p.e=kT/TSTAR[p.s];p.fx=0;p.fy=p.s===2?0:.3;
      if(p.s===0){p.fx+=14*(p.hx-p.x);p.fy+=14*(p.hy-p.y);}}
    for(let i=0;i<n;i++){
      const a=ps[i];
      for(let j=i+1;j<n;j++){
        const b=ps[j],dx=b.x-a.x,dy=b.y-a.y;let r2=dx*dx+dy*dy;
        if(r2>6.25) continue;
        let e=Math.sqrt(a.e*b.e);
        if(r2<1.26) e=Math.max(e,.4);
        r2=Math.max(r2,.55);
        const q=1/r2,q6=q*q*q,f=24*e*q6*(2*q6-1)*q;
        a.fx-=f*dx;a.fy-=f*dy;b.fx+=f*dx;b.fy+=f*dy;
      }
    }
    for(let i=0;i<n;i++){
      const p=ps[i];p.vx+=p.fx*h;p.vy+=p.fy*h;p.x+=p.vx*h;p.y+=p.vy*h;
      if(p.x<.45){p.x=.45;p.vx=Math.abs(p.vx);} if(p.x>Lx-.45){p.x=Lx-.45;p.vx=-Math.abs(p.vx);}
      if(p.y<.45){p.y=.45;p.vy=Math.abs(p.vy);} if(p.y>Ly-.45){p.y=Ly-.45;p.vy=-Math.abs(p.vy);}
    }
  }
  thermostat(){
    const{ps}=this,kT=this.kT();let sum=0;ps.forEach(p=>sum+=p.vx*p.vx+p.vy*p.vy);
    const cur=sum/(2*ps.length)||1e-3,l=clamp(Math.sqrt(1+.15*(kT/cur-1)),.8,1.2);
    ps.forEach(p=>{p.vx*=l;p.vy*=l;const v=Math.hypot(p.vx,p.vy);if(v>6){p.vx*=6/v;p.vy*=6/v;}});
  }
  draw(cv){
    const c=cv.getContext('2d'),k=cv.width/this.W,sg=this.sg,{ps}=this;
    c.setTransform(k,0,0,k,0,0);c.clearRect(0,0,this.W,this.H);
    if(this.bonds){
      c.lineCap='round';
      for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){
        const a=ps[i],b=ps[j];if(a.s===2||b.s===2) continue;
        const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>1.55) continue;
        c.strokeStyle=`rgba(242,84,45,${(.95-(d-.9)*1.2).toFixed(2)})`;c.lineWidth=a.s===0&&b.s===0?2:1.2;
        c.beginPath();c.moveTo(a.x*sg,a.y*sg);c.lineTo(b.x*sg,b.y*sg);c.stroke();
      }
    }
    c.fillStyle='#1414e6';
    ps.forEach(p=>{c.beginPath();c.arc(p.x*sg,p.y*sg,5,0,6.29);c.fill();});
  }
  frame(){
    if(!this.paused){for(let i=0;i<6;i++)this.step(.01);this.thermostat();}
    this.draw(this.cv);if(this.view)this.draw(this.view);
  }
}

function submit(val,btn){

  lock=true;setTimeout(()=>lock=false,400);

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,text,max){const out=[];let l='';for(const ch of text.replace(/\n/g,' ')){if(c.measureText(l+ch).width>max){out.push(l);l=ch;}else l+=ch;}if(l)out.push(l);return out;}
function rankOf(r,c){const q=score(r,c)/maxScore(c);return w(q>=.9?'입자 박사':q>=.7?'입자 탐험가':'입자 새내기');}
function badgesOf(r,c){
  const out=[],first=c.items.filter(i=>r.pts[i.id]===FULL).length;
  if(first===c.items.length)out.push(w('완벽한 원정: 모든 칸을 한 번에'));
  if(r.best>=5)out.push(F('comboBadge',r.best));
  if(c.items.some(i=>(r.wrong[i.id]||0)>=2))out.push(w('끝까지 해냄: 힌트를 보고 완주'));
  out.push(w('몬스터 퇴치'));
  return out;
}

/* ===== 화면 맞춤 =====
   무대 크기를 화면 비율에 맞춰 정하고 통째로 배율을 적용한다.
   가로형은 높이 720 이상, 세로형은 높이 1140 이상을 보장해 내용이 잘리지 않는다.
   화면 키보드가 올라오면 배율은 그대로 두고 스크롤만 허용한다. */
let baseW=0,baseH=0;
const typing=()=>/^(INPUT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName||'');
function viewBox(){const r=document.body.getBoundingClientRect();return[r.width,r.height];}
function fit(){
  const[w,h]=viewBox();
  if(!w||!h) return;
  if(typing()&&baseH&&Math.abs(w-baseW)<2&&h<=baseH){kbCheck();return;}
  document.documentElement.classList.remove('kb');$('fit').style.height='';
  baseW=w;baseH=h;
  const a=w/h;let W,H;
  if(a>=1.05){W=Math.max(1120,720*a);H=W/a;}else{H=Math.max(1140,640/a);W=H*a;}
  const app=$('app');
  app.style.width=W+'px';app.style.height=H+'px';app.style.transform=`scale(${w/W})`;
  document.documentElement.dataset.o=a>=1.05?'l':'p';
}
function kbCheck(){
  const vv=window.visualViewport,root=document.documentElement;
  const seen=vv?vv.height*(vv.scale||1):innerHeight,kb=Math.max(0,baseH-Math.min(seen,viewBox()[1]));
  const open=typing()&&kb>baseH*.15,was=root.classList.contains('kb');
  root.classList.toggle('kb',open);
  $('fit').style.height=open?(baseH+kb)+'px':'';
  if(open&&!was) setTimeout(()=>document.activeElement.scrollIntoView({block:'center'}),60);
  if(!open&&was) document.body.scrollTop=0;
}
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const exitFS=()=>(document.exitFullscreen||document.webkitExitFullscreen).call(document);
async function toggleFS(btn){
  try{
    if(fsEl()) await exitFS();
    else{const el=document.documentElement;await (el.requestFullscreen||el.webkitRequestFullscreen).call(el);}
  }catch(e){btn.textContent=w('전체화면 불가');btn.disabled=true;}
}
function paintFS(){document.querySelectorAll('.fsBtn').forEach(b=>{if(!b.disabled)b.textContent=w(fsEl()?'화면 줄이기':'전체화면');});fit();}
if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled)) document.querySelectorAll('.fsBtn').forEach(b=>b.hidden=true);
document.querySelectorAll('.fsBtn').forEach(b=>b.addEventListener('click',()=>toggleFS(b)));
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,paintFS));
addEventListener('resize',fit);
if(window.visualViewport) visualViewport.addEventListener('resize',kbCheck);
document.addEventListener('focusin',()=>setTimeout(kbCheck,350));
document.addEventListener('focusout',()=>setTimeout(()=>{kbCheck();fit();},350));

/* ===== 언어 전환 ===== */
const H1={ko:'상태변화와<br>입자 <span>원</span><span>정</span>대',en:'State Change &amp;<br>Particle <span>Exp</span><span>edition</span>',zh:'状态变化与<br>粒子<span>探</span><span>险</span>队'};
function applyLang(){
  const l=lang();
  document.documentElement.lang=l;
  FONT_D=l==='zh'?'"Noto Sans SC", sans-serif':'Jua, "Gothic A1", sans-serif';
  FONT_B=l==='zh'?'"Noto Sans SC", sans-serif':'"Gothic A1", sans-serif';
  document.title=w('상태변화와 입자 원정대');
  $('heroTitle').innerHTML=H1[l];
  document.querySelectorAll('[data-i]').forEach(e=>{if(!e.dataset.ko)e.dataset.ko=e.textContent;e.textContent=w(e.dataset.ko);});
  document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=w(e.dataset.ip));
  document.querySelectorAll('.langs').forEach(g=>{const short=g.classList.contains('short');
    g.innerHTML=LANGS.map(([k,a,b])=>`<button type="button" data-lang="${k}" aria-label="${a}" aria-pressed="${k===l}">${short?b:a}</button>`).join('');});
  fillSelects();paintFS();paintLab();
}
function setLang(l){
  S.lang=l;persist();applyLang();
  if(!$('vHome').hidden) renderHome();
  if(!$('vGame').hidden){paintHead();if(R.phase==='write')renderWrite();else{curView='';renderItem(true);}}
  if(!$('vDone').hidden) finish(true);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(b)setLang(b.dataset.lang);});

/* ===== 연결 ===== */
function fillSelects(){
  const opt=(n)=>`<option value="">${w('선택')}</option>`+Array.from({length:n},(_,i)=>`<option>${i+1}</option>`).join('');
  const c=$('inClass').value||S.cls,n=$('inNum').value||S.num;
  $('inClass').innerHTML=opt(CLASS_COUNT);$('inNum').innerHTML=opt(STUDENT_COUNT);
  $('inClass').value=c;$('inNum').value=n;if(!$('inName').value)$('inName').value=S.name;
}
